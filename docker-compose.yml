services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      PORT: 3000
      DATA_PATH: /app/data/data.json
    volumes:
      - salle_data:/app/data

volumes:
  salle_data:

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Où est ma salle ?</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>📍 Où est ma salle ?</h1>
    <p>Sélectionne ta classe pour voir la salle du jour</p>
  </header>

  <main class="container">
    <div class="card">
      <label for="classe-select">Ma classe</label>
      <select id="classe-select">
        <option value="">Chargement...</option>
      </select>
    </div>

    <div id="result-card" class="card result" hidden>
      <div id="result-content"></div>
    </div>

    <div id="error-card" class="card" hidden>
      <p class="error-msg" id="error-text"></p>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
